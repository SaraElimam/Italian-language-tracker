<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Italian Study Log</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Pixelify Sans', monospace;
      background-color: #fcf6ed;
      background-image: radial-gradient(#e5d8c5 1.5px, transparent 1.5px);
      background-size: 16px 16px;
      color: #3c3234;
    }

    .retro-box {
      border: 3px solid #3c3234;
      box-shadow: 4px 4px 0px #3c3234;
    }

    .retro-box-sm {
      border: 2px solid #3c3234;
      box-shadow: 2px 2px 0px #3c3234;
    }

    .retro-btn {
      transition: all 0.1s;
    }
    
    .retro-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px #3c3234 !important;
    }

    .folder-tab {
      border-top: 3px solid #3c3234;
      border-left: 3px solid #3c3234;
      border-right: 3px solid #3c3234;
      border-bottom: none;
    }
  </style>
</head>
<body class="p-4 md:p-8">

  <header class="max-w-5xl mx-auto bg-[#fce8d5] retro-box rounded-xl p-5 mb-8">
    <div class="flex flex-wrap items-center justify-between gap-4 border-b-2 border-[#3c3234] pb-4">
      <div>
        <span class="text-xs tracking-wider uppercase bg-[#fff] px-2 py-0.5 rounded border border-[#3c3234]">Daily Study Manifest</span>
        <h1 class="text-2xl font-bold tracking-wide mt-1">ITALIAN LANGUAGE LOG</h1>
      </div>
      
      <div class="flex flex-wrap gap-1.5 bg-[#f5d9c2] p-1.5 rounded-lg border-2 border-[#3c3234]" id="level-buttons-container">
        <!-- Buttons injected by JS -->
      </div>
    </div>

    <div class="grid grid-cols-3 gap-3 mt-4 text-xs font-semibold">
      <div class="bg-[#fff] retro-box-sm rounded-lg p-2.5 text-center">
        <span class="block text-[10px] text-stone-500">COMPLETED</span>
        <span id="stat-progress" class="text-base text-emerald-700">0%</span>
      </div>
      <div class="bg-[#fff] retro-box-sm rounded-lg p-2.5 text-center">
        <span class="block text-[10px] text-stone-500">TILES LEFT</span>
        <span id="stat-remaining" class="text-base text-amber-700">0 REMAIN</span>
      </div>
      <div class="bg-[#fff] retro-box-sm rounded-lg p-2.5 text-center">
        <span class="block text-[10px] text-stone-500">AVG SCORE</span>
        <span id="stat-average" class="text-base text-sky-700">--</span>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto space-y-8" id="curriculum-container"></main>

  <!-- Retro Modal -->
  <div id="score-modal" class="fixed inset-0 bg-[#3c3234]/40 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
    <div class="bg-[#f0f9ee] retro-box rounded-xl max-w-sm w-full p-5">
      <div class="flex items-center gap-3 border-b-2 border-[#3c3234] pb-3 mb-4">
        <span id="modal-icon" class="text-3xl bg-[#fff] p-2 rounded retro-box-sm">📝</span>
        <div>
          <h3 id="modal-title" class="font-bold text-sm leading-tight">Update Tile</h3>
          <a id="modal-link" href="#" target="_blank" class="text-[10px] text-sky-700 underline font-semibold">Open Study Material ↗</a>
        </div>
      </div>

      <div id="score-input-container" class="space-y-2 mb-5">
        <label class="text-xs font-bold">EXERCISE MARK (%)</label>
        <input type="number" id="modal-score" min="0" max="100" placeholder="e.g. 85" 
               class="w-full retro-box-sm rounded px-3 py-2 text-sm focus:outline-none bg-white">
      </div>

      <div class="flex justify-between items-center gap-2">
        <button id="btn-delete" class="text-xs text-red-600 font-bold hover:underline">Reset</button>
        <div class="flex space-x-2">
          <button id="btn-cancel" class="retro-btn retro-box-sm px-3 py-1.5 text-xs bg-white rounded font-bold">Cancel</button>
          <button id="btn-save" class="retro-btn retro-box-sm px-4 py-1.5 text-xs text-white bg-[#5e945c] rounded font-bold">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const iconMap = {
      "cibo": "🥖", "food": "🥖", "cucinare": "🍳", "sapori": "🍷",
      "orologio": "⏰", "clock": "⏰", "tempo": "⏳", "giorni": "📅",
      "casa": "🏡", "house": "🏡", "appartamento": "🏢", "albergo": "🏨", "quartiere": "🗺️",
      "articoli": "🏷️", "articles": "🏷️", "plurali": "👥", "verbi": "⚡",
      "passato": "📜", "futuro": "🔮", "preposizioni": "🧭", "aggettivi": "✨",
      "shopping": "🛍️", "negozi": "🛍️", "mare": "🌊", "hobby": "🎨", "lavoro": "💼", "famiglia": "👨‍👩‍👧",
      "ascolto": "🎧", "listening": "🎧", "dialogo": "💬", "pronuncia": "🗣️", "grammatica": "📚"
    };

    function getTopicIcon(title, category) {
      const lowerTitle = title.toLowerCase();
      const lowerCat = category.toLowerCase();
      
      if (lowerCat.includes("listening")) return "🎧";
      if (lowerCat.includes("exercise") || lowerCat.includes("quiz")) return "📝";
      
      for (const [key, icon] of Object.entries(iconMap)) {
        if (lowerTitle.includes(key)) return icon;
      }
      return "📜"; 
    }

    let curriculumAll = {};
    let currentLevel = "A1";
    let userData = JSON.parse(localStorage.getItem('italian_club_data')) || {};
    let activeTile = null;

    fetch('curriculum.json')
      .then(res => res.json())
      .then(data => {
        curriculumAll = data;
        renderLevels();
        render();
      })
      .catch(err => {
        document.getElementById('curriculum-container').innerHTML = '<div class="p-8 text-center font-bold">Error loading curriculum.json. Did you run the scraper?</div>';
      });

    function renderLevels() {
      const container = document.getElementById('level-buttons-container');
      container.innerHTML = '';
      const levels = ["A1", "A2", "B1", "B2", "C1", "C2"];
      
      levels.forEach(lvl => {
        const btn = document.createElement('button');
        const isActive = lvl === currentLevel;
        btn.className = `retro-btn px-3 py-1 font-bold text-xs rounded border-2 border-[#3c3234] shadow-[2px_2px_0px_#3c3234] ${isActive ? 'bg-[#bfe3c0]' : 'bg-white hover:bg-[#fff9f0]'}`;
        btn.innerText = lvl;
        btn.onclick = () => {
          currentLevel = lvl;
          renderLevels();
          render();
        };
        container.appendChild(btn);
      });
    }

    function saveState() {
      localStorage.setItem('italian_club_data', JSON.stringify(userData));
      render();
    }

    function render() {
      const container = document.getElementById('curriculum-container');
      container.innerHTML = '';

      const levelSections = curriculumAll[currentLevel] || [];
      let totalTiles = 0, completedTiles = 0, totalScores = 0, scoredCount = 0;

      if (levelSections.length === 0) {
        container.innerHTML = `<div class="p-8 text-center font-bold">No lessons found for ${currentLevel}.</div>`;
        return;
      }

      levelSections.forEach((section, sIdx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'relative pt-6';

        // Folder Tab
        const tab = document.createElement('div');
        tab.className = 'absolute top-0 left-4 bg-[#d8ecd5] folder-tab px-4 py-1 rounded-t-lg font-bold text-xs bg-[#e6dff2]';
        tab.innerText = section.category;
        wrapper.appendChild(tab);

        // Folder Body
        const body = document.createElement('div');
        body.className = 'bg-[#f8f5fd] retro-box rounded-xl rounded-tl-none p-5';
        
        const grid = document.createElement('div');
        grid.className = 'grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3';

        section.items.forEach((item, iIdx) => {
          totalTiles++;
          const tileId = `${currentLevel}-${sIdx}-${iIdx}`;
          const isDone = userData[tileId]?.completed;
          const score = userData[tileId]?.score;
          const icon = getTopicIcon(item.title, section.category);

          if (isDone) {
            completedTiles++;
            if (score !== null && score !== undefined && score !== '') {
              totalScores += Number(score);
              scoredCount++;
            }
          }

          const tile = document.createElement('div');
          
          if (isDone) {
            tile.className = 'bg-[#c2e7be] retro-box-sm rounded-lg p-3 flex items-start gap-3 cursor-pointer retro-btn shadow-[2px_2px_0px_#3c3234] hover:bg-[#b5e0b0]';
            tile.innerHTML = `
              <div class="text-2xl bg-[#a7d9a1] p-2 rounded border-2 border-[#3c3234] shrink-0">${icon}</div>
              <div class="flex-1 min-w-0">
                <div class="flex items-center justify-between">
                  <h3 class="font-bold text-sm leading-tight truncate">${item.title}</h3>
                  <span class="text-xs font-bold text-emerald-800">✓</span>
                </div>
                ${score !== null && score !== undefined && score !== '' ? `<span class="inline-block bg-[#3c3234] text-[#fff] text-[10px] px-1.5 py-0.5 rounded font-bold mt-1">${score}% Mark</span>` : `<span class="inline-block text-[#3c3234] text-[10px] font-bold mt-1">Completed</span>`}
              </div>
            `;
          } else {
            tile.className = 'bg-[#fffdfa] retro-box-sm rounded-lg p-3 flex items-start gap-3 cursor-pointer retro-btn shadow-[2px_2px_0px_#3c3234] hover:bg-[#fff9f0]';
            tile.innerHTML = `
              <div class="text-2xl bg-[#faecd8] p-2 rounded border-2 border-[#3c3234] shrink-0">${icon}</div>
              <div class="flex-1 min-w-0">
                <h3 class="font-bold text-sm leading-tight truncate">${item.title}</h3>
                <p class="text-[10px] text-stone-500 mt-0.5 uppercase tracking-wide">${section.isScored ? 'Exercise' : 'Lesson'}</p>
              </div>
            `;
          }

          tile.onclick = () => openModal(tileId, item.title, item.url, section.isScored, icon);
          grid.appendChild(tile);
        });

        body.appendChild(grid);
        wrapper.appendChild(body);
        container.appendChild(wrapper);
      });

      const percent = totalTiles > 0 ? Math.round((completedTiles / totalTiles) * 100) : 0;
      document.getElementById('stat-progress').innerText = `${percent}%`;
      document.getElementById('stat-remaining').innerText = `${totalTiles - completedTiles} LEFT`;
      document.getElementById('stat-average').innerText = scoredCount > 0 ? `${Math.round(totalScores / scoredCount)}%` : '--';
    }

    const modal = document.getElementById('score-modal');
    const modalTitle = document.getElementById('modal-title');
    const modalLink = document.getElementById('modal-link');
    const modalScore = document.getElementById('modal-score');
    const modalIcon = document.getElementById('modal-icon');
    const scoreContainer = document.getElementById('score-input-container');

    function openModal(id, title, url, isScored, icon) {
      activeTile = { id, title, isScored };
      modalTitle.innerText = title;
      modalLink.href = url;
      modalIcon.innerText = icon;
      
      const record = userData[id] || {};
      modalScore.value = record.score ?? '';
      scoreContainer.style.display = isScored ? 'block' : 'none';
      
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    document.getElementById('btn-cancel').onclick = () => {
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    };

    document.getElementById('btn-delete').onclick = () => {
      if (activeTile) {
        delete userData[activeTile.id];
        saveState();
      }
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    };

    document.getElementById('btn-save').onclick = () => {
      if (activeTile) {
        userData[activeTile.id] = {
          completed: true,
          score: activeTile.isScored && modalScore.value !== '' ? Number(modalScore.value) : null
        };
        saveState();
      }
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    };
  </script>
</body>
</html>
